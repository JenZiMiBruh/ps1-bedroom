<!doctype html>
<meta charset="utf-8">
<title>Native shader check</title>
<pre id="out">checking…</pre>
<script>
// Compiles every native shader (engine/Shaders.kt and the sky's custom shaders in Sky.kt) with WebGL 2 (GLSL ES 3.00,
// the same language as Android's OpenGL ES 3.0) and links each program, so mistakes show up before an APK goes to a phone.
(async () => {
  const out = document.getElementById('out');
  const base = '../app/src/com/ps1bedroom/room/';
  const shaders = {};
  for (const f of ['engine/Shaders.kt', 'Sky.kt']) {
    const src = await (await fetch(base + f + '?' + Date.now())).text();
    for (const m of src.matchAll(/const val (\w+) = """([\s\S]*?)"""/g)) shaders[m[1]] = m[2];
    for (const m of src.matchAll(/const val (\w+) = "(?!")([^"\n]*)"/g)) shaders[m[1]] = m[2];
  }
  // Kotlin string templates ($NAME) inside the shader sources
  for (const k of Object.keys(shaders)) shaders[k] = shaders[k].replace(/\$(\w+)/g, (s, n) => shaders[n] !== undefined ? shaders[n] : s);
  const gl = document.createElement('canvas').getContext('webgl2');
  const lines = [];
  const compile = (type, name) => {
    const s = gl.createShader(type); gl.shaderSource(s, shaders[name]); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { lines.push(`FAIL ${name}: ${gl.getShaderInfoLog(s)}`); return null; }
    lines.push(`ok   ${name}`); return s;
  };
  const pairs = [['PS1_VERT', 'PS1_FRAG'], ['DEPTH_VERT', 'DEPTH_FRAG'], ['QUAD_VERT', 'POST_FRAG'], ['QUAD_VERT', 'BLIT_FRAG'], ['SKY_VERT', 'DOME_FRAG'], ['SKY_VERT', 'CLOUD_FRAG']];
  for (const [v, f] of pairs) {
    const vs = compile(gl.VERTEX_SHADER, v), fs = compile(gl.FRAGMENT_SHADER, f);
    if (!vs || !fs) continue;
    const p = gl.createProgram(); gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p);
    lines.push(gl.getProgramParameter(p, gl.LINK_STATUS) ? `ok   link ${v}+${f}` : `FAIL link ${v}+${f}: ${gl.getProgramInfoLog(p)}`);
  }
  out.textContent = lines.join('\n');
  window.__result = lines;
})();
</script>
